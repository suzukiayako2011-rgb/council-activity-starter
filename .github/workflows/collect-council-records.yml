name: 議会発言データの取得（確認用）
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ブラウザの準備
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: 公開会議録の取得と発言候補の抽出
        run: python tools/collect_council_records.py
      - name: 取得結果を保存（公開サイトには反映しない）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: council-records-review
          path: collected_records/
          if-no-files-found: warn
          retention-days: 30
